; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = melty

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags = 
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1

[env:controller]
build_src_filter = +<controller_main.cpp> +<controller.cpp> +<interface.cpp>
; upload_port = /dev/ttyACM0
; monitor_port = /dev/ttyACM0
build_flags = 
	${env.build_flags}
	-D CONTROLLER
lib_deps = 
	madhephaestus/ESP32Servo@^3.0.9
	olikraus/U8g2@^2.35.9

; Controller with OLED display, joystick, and rotary encoders
[env:controller_hw]
build_src_filter = +<controller_main.cpp> +<controller.cpp> +<interface.cpp>
build_flags = 
	${env.build_flags}
	-D CONTROLLER
	-D USE_HARDWARE
lib_deps = 
	madhephaestus/ESP32Servo@^3.0.9
	olikraus/U8g2@^2.35.9

[env:melty]
build_src_filter = +<melty_main.cpp>
; upload_port = /dev/ttyACM1
; monitor_port = /dev/ttyACM1
build_flags = 
	${env.build_flags}
	-D MELTY
lib_deps = madhephaestus/ESP32Servo@^3.0.9

; Build/run the generic sketch entrypoint in src/main.cpp
; Useful for quick experiments without MELTY/CONTROLLER defines.
[env:main]
build_src_filter = +<main.cpp>
monitor_speed = 115200
build_flags =
	${env.build_flags}
	-D MAIN
lib_deps = madhephaestus/ESP32Servo@^3.0.9

; Bidirectional MotorDrivers test on pins 6 and 7 (src/test.cpp).
[env:test]
build_src_filter = +<test.cpp>
monitor_speed = 115200
build_flags =
	${env.build_flags}
	-D TEST
lib_deps = madhephaestus/ESP32Servo@^3.0.9
